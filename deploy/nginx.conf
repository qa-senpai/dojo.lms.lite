# Place in /etc/nginx/conf.d/dojo-lite.conf. Remove the default site if needed.
# Change server_name to the VPS IP or DNS hostname; APP_URL must match it.
limit_req_zone $binary_remote_addr zone=dojo_auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dojo_api:1m rate=10r/s;
server {
    listen 80;
    server_name dojo.example;
    client_max_body_size 6m;
    location /api/auth/ {
        limit_req zone=dojo_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_req zone=dojo_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
